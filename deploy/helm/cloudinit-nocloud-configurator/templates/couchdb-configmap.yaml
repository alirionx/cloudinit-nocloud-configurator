{{- if .Values.couchdb.enabled }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "cnc.couchdbName" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "cnc.labels" . | nindent 4 }}
    {{- include "cnc.couchdbSelectorLabels" . | nindent 4 }}
data:
  # Single-node setup: CouchDB creates its system databases (_users, _replicator) itself.
  10-single-node.ini: |
    [couchdb]
    single_node = true

    [chttpd]
    bind_address = any
{{- end }}
