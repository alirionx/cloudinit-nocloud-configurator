{{- if .Values.couchdb.enabled }}
# Headless service: stable DNS name for the StatefulSet pod, also used by the app.
apiVersion: v1
kind: Service
metadata:
  name: {{ include "cnc.couchdbName" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "cnc.labels" . | nindent 4 }}
    {{- include "cnc.couchdbSelectorLabels" . | nindent 4 }}
spec:
  clusterIP: None
  ports:
    - name: couchdb
      port: 5984
      targetPort: couchdb
      protocol: TCP
  selector:
    {{- include "cnc.couchdbSelectorLabels" . | nindent 4 }}
{{- end }}
