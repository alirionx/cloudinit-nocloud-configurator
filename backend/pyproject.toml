[project]
name = "cloudinit-nocloud-configurator"
version = "0.1.0"
description = "Web app to build cloud-init NoCloud seed drives"
license = "MIT"
requires-python = ">=3.13"
dependencies = [
    "anyio>=4.15.1",
    "fastapi>=0.143.2",
    "httpx2>=2.13.1",
    "jsonschema>=4.26.0",
    "pydantic-settings>=2.16.0",
    "pyyaml>=6.0.3",
    "tinydb>=4.9.0",
    "uvicorn>=0.54.0",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.17.1",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM"]
