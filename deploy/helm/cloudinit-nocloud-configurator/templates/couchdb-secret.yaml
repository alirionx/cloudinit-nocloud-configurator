{{- if and .Values.couchdb.enabled (not .Values.couchdb.existingSecret) }}
{{- /*
Generated credentials (DEP-004): a random password is created on the first install and
taken over from the existing Secret on every upgrade, so it stays stable.
*/}}
{{- $name := include "cnc.couchdbName" . }}
{{- $existing := lookup "v1" "Secret" .Release.Namespace $name }}
{{- $data := dict }}
{{- if $existing }}
{{- $data = $existing.data }}
{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "cnc.labels" . | nindent 4 }}
    {{- include "cnc.couchdbSelectorLabels" . | nindent 4 }}
type: Opaque
data:
  username: {{ .Values.couchdb.username | b64enc | quote }}
  password: {{ get $data "password" | default (randAlphaNum 32 | b64enc) | quote }}
  cookieSecret: {{ get $data "cookieSecret" | default (randAlphaNum 32 | b64enc) | quote }}
{{- end }}
